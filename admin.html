<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Add New Code</title>
  <style>
    body { font-family: sans-serif; padding: 40px; background: #f9f9f9; }
    .admin-card { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    input, textarea { width: 100%; margin-bottom: 15px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 15px; background: #000; color: white; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; }
    button:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="admin-card">
    <h2>Add New Entry</h2>
    <input type="text" id="c_id" placeholder="Enter Code (e.g. 6364)">
    <input type="text" id="c_title" placeholder="Enter Title (e.g. Card Hover Effect)">
    <textarea id="c_content" rows="12" placeholder="Paste your code content here..."></textarea>
    <button onclick="upload()">Save to Database</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = supabase.createClient('https://lzvetvqutuetedunkrxs.supabase.co', 'sb_publishable_0r2EnDzm8AOE_INsRWbLrQ_gnVaCiS7');

    async function upload() {
      const id = document.getElementById('c_id').value.trim();
      const title = document.getElementById('c_title').value.trim();
      const content = document.getElementById('c_content').value.trim();

      if(!id || !title || !content) { alert("Please fill all fields!"); return; }
      const { error } = await supabase.from('codes').insert([{
        code_id: id,
        title: title,
        code_content: content // دڵنیابەوە لێرەش code_content بێت
      }]);

      if (!error) {
        alert("Success! Code is now live.");
        document.getElementById('c_id').value = '';
        document.getElementById('c_title').value = '';
        document.getElementById('c_content').value = '';
      } else {
        alert("Error: " + error.message);
      }
    }
  </script>
</body>
</html>
